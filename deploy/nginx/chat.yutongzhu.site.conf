# chat.yutongzhu.site — reverse proxy to the FastAPI backend (host port 8000).
#
# Install on the server:
#   scp deploy/nginx/chat.yutongzhu.site.conf root@39.106.85.231:/etc/nginx/conf.d/
#   nginx -t && systemctl reload nginx
# Then issue the certificate (certbot rewrites this file with the 443 block):
#   certbot --nginx -d chat.yutongzhu.site

server {
    listen 80;
    server_name chat.yutongzhu.site;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: buffering must be OFF or streamed tokens arrive in lumps
        # (and read timeout must outlast the longest agent reply).
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
