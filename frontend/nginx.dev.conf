# Local: same as nginx.conf, but /api goes to host uvicorn on port 8001.
# Used via docker-compose.override.yml (see docker-compose.override.example.yml).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://host.docker.internal:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Chrome sends gzip/br; compressing an SSE stream lets the proxy
        # close mid-chunk ("upstream prematurely closed").
        proxy_set_header Accept-Encoding "";
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_socket_keepalive on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /nginx.*\.conf$ {
        deny all;
    }
}
