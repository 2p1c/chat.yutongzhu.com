<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>
    // Theme bootstrap (mirrors src/lib/theme.ts) — runs before paint to avoid flash
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var theme = (stored === 'light' || stored === 'dark') ? stored : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>
  <script>
    // Language bootstrap (mirrors src/lib/lang.ts)
    (function () {
      try {
        var stored = localStorage.getItem('lang');
        if (stored === 'en' || stored === 'zh') {
          document.documentElement.setAttribute('data-lang', stored);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="/images/favicon.png" />
  <title>{ Yutong Zhu } — Agent</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <!-- Animated Vanta fog background (fixed full-viewport, sits below content) -->
  <div id="vanta-bg" aria-hidden="true"></div>

  <!-- Sidebar: full-bleed slide-in from the viewport's left edge -->
  <aside id="sidebar" class="sidebar" aria-label="Session list" aria-hidden="true">
    <div class="sidebar-inner">
      <div class="sidebar-toolbar">
        <button id="btn-sidebar-close" class="sidebar-toolbar-btn" type="button" aria-label="Close sidebar" title="收起侧边栏">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <button id="btn-new-session-inline" class="sidebar-toolbar-btn" type="button" aria-label="New session" title="新建会话">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        </button>
      </div>
      <div class="sidebar-list" id="sidebar-list"></div>
    </div>
  </aside>

  <!-- Left-edge floating icon rail (panel-left + message-circle-plus) -->
  <div class="icon-rail">
    <button id="btn-sidebar-toggle" class="icon-rail-btn" type="button" aria-label="Toggle session list" title="会话列表">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
    </button>
    <button id="btn-new-session" class="icon-rail-btn" type="button" aria-label="New session" title="新建会话">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
    </button>
  </div>

  <button id="btn-loop-toggle" class="icon-rail-btn header-loop-toggle" type="button" hidden aria-label="Toggle Agent loop" title="Agent loop">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
  </button>

  <div class="page">
    <header>
      <h1><a href="/" style="color: inherit; text-decoration: none;">{ Yutong Zhu }</a></h1>
      <span class="subtitle">developer • student • robot</span>
      <div class="header-actions">
        <button id="btn-login" class="theme-toggle header-login" type="button" hidden aria-label="Log in" title="Log in">
          <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <button id="btn-logout" class="theme-toggle header-logout" type="button" hidden aria-label="Log out" title="Log out">
          <svg class="theme-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></svg>
        </button>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle theme" title="Toggle light / dark mode">
          <svg class="theme-icon theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="theme-icon theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/></svg>
        </button>
      </div>
    </header>

    <main class="chat">
      <div id="messages" class="chat-messages" aria-live="polite"></div>
      <div class="chat-composer">
        <div id="composer-card" class="composer-card" hidden></div>
        <div class="chat-input">
          <textarea id="chat-textarea" class="chat-textarea" rows="1"
            placeholder="Ask anything..." aria-label="Message"></textarea>
          <button id="chat-send" class="chat-send" type="button" aria-label="Send" disabled>
            <svg class="chat-send-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
          </button>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <p>Thanks to <a href="https://mariozechner.at/">Mario Zechner</a>, a fantastic developer with truly inspiring blog! I basically copy his website style. </p>
      <p>© Copyright <span id="current-year"></span> by Yutong Zhu.</p>
    </footer>
  </div>

  <div id="auth-gate" class="auth-gate" hidden>
    <form id="auth-form" class="auth-card">
      <button id="auth-close" class="auth-close" type="button" aria-label="Close" title="Close">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <h2 class="lang-en">Sign in</h2>
      <h2 class="lang-zh">登录</h2>
      <p class="auth-lead lang-en">Enter your email and we’ll send a 6-digit code.</p>
      <p class="auth-lead lang-zh">输入邮箱，我们会发送 6 位验证码。</p>
      <label class="auth-label" for="auth-email">Email</label>
      <input id="auth-email" class="auth-input" type="email" required autocomplete="email" spellcheck="false">
      <div id="auth-code-wrap" hidden>
        <label class="auth-label" for="auth-code">
          <span class="lang-en">Code</span>
          <span class="lang-zh">验证码</span>
        </label>
        <input id="auth-code" class="auth-input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" spellcheck="false">
      </div>
      <p id="auth-error" class="auth-error" hidden></p>
      <button id="auth-submit" class="auth-submit" type="submit">
        <span class="lang-en" data-auth-send>Send code</span>
        <span class="lang-zh" data-auth-send>发送验证码</span>
        <span class="lang-en" data-auth-verify hidden>Verify</span>
        <span class="lang-zh" data-auth-verify hidden>验证</span>
      </button>
    </form>
  </div>

  <aside id="loop-debug" class="loop-debug" aria-label="Agent loop" aria-hidden="true">
    <div class="loop-debug-inner">
      <div class="loop-debug-toolbar">
        <button id="btn-loop-close" class="sidebar-toolbar-btn" type="button" aria-label="Close Agent loop" title="收起">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></svg>
        </button>
        <span class="loop-debug-title">Agent loop</span>
        <button id="loop-debug-clear" class="loop-debug-clear" type="button">Clear</button>
      </div>
      <p id="loop-debug-empty" class="loop-debug-empty">显示每次 loop 具体行为</p>
      <ol id="loop-debug-list" class="loop-debug-list"></ol>
    </div>
  </aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.12/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.6/purify.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
