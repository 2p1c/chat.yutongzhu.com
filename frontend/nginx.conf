# Production: compose service `web` → static files + /api to `backend:8000`.
# SSE: buffering MUST stay off or streamed tokens arrive in lumps.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Variable + Docker DNS so nginx can start before `backend` is up
        # (web does not depends_on backend).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_backend backend;
        proxy_pass http://$api_backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Accept-Encoding "";
        gzip off;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_socket_keepalive on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /nginx.*\.conf$ {
        deny all;
    }
}
