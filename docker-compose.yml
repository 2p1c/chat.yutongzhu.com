services:
  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: chat-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatdb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      # Runs the schema on first volume init; `python init_db.py` re-runs it idempotently later.
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatdb"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RAG search (rag-store-server). Built and pushed to GHCR by that repo's CI;
  # this file only consumes the image. Index is bind-mounted, not baked in.
  rag:
    image: ghcr.io/2p1c/rag-store-server:latest
    container_name: chat-rag
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOST: 0.0.0.0
      INDEX_DIR: /data/indexes/msmarco-minilm
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in .env}
    volumes:
      - ./data/rag-indexes:/data/indexes:ro

  # TypeScript Agent (mmagent). Built and pushed to GHCR by the Agent repo's
  # CI (my-minimal-agent); this file only consumes the image.
  agent:
    image: ghcr.io/2p1c/mmagent:latest
    container_name: chat-agent
    ports:
      - "127.0.0.1:8765:8001"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in .env or shell}
      MODEL: ${MODEL:?set MODEL in .env}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:?set OPENAI_BASE_URL in .env}
      RAG_SEARCH_URL: http://rag:8080/search
    depends_on:
      - rag

  # FastAPI API only (no static files). Not published on the host; `web` proxies /api.
  backend:
    build: ./backend
    container_name: chat-backend
    environment:
      # Inside the compose network we dial services by name, not localhost.
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chatdb
      AGENT_URL: http://agent:8001
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-yutongzhu <noreply@chat.yutongzhu.site>}
      AUTH_EMAIL_ALLOWLIST: ${AUTH_EMAIL_ALLOWLIST:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      agent:
        condition: service_started

  # Static frontend + reverse proxy. Host nginx (TLS) still points at 127.0.0.1:8000.
  # No depends_on backend: local `up web` must not start the production backend container.
  web:
    image: nginx:alpine
    container_name: chat-web
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  redis-data:
  pg-data:
