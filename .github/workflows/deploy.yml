name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 600 /dev/null ~/chat_yutongzhu_com
          echo "$SSH_KEY" > ~/chat_yutongzhu_com
          ssh -i ~/chat_yutongzhu_com -o StrictHostKeyChecking=accept-new "$SSH_USER@$SSH_HOST" "
            set -e
            cd '$DEPLOY_PATH'
            git pull
            docker compose build backend
            docker compose up -d --no-deps backend web
            docker image prune -f
          "
          rm -f ~/chat_yutongzhu_com
